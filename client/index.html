<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#81c141" />
    <!-- The icon font is declared in src/styles.css, not here.
         Vite fingerprints anything referenced from CSS it processes, so the
         file ships as material-symbols-rounded-<hash>.woff2 and a changed font
         gets a changed URL. Declared inline here it kept one stable filename,
         and index.js serves that path with `immutable, max-age=31536000` — so
         every browser that had already loaded the app was pinned to the old
         font for a year. Regenerating the subset silently reached nobody. -->
    <title>Bonanza CRM</title>
    <script>
      /* Apply the stored theme before first paint, so a dark-mode user never
         sees a white flash while React boots. */
      (function () {
        try {
          var t = localStorage.getItem('bnz_theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
          var org = localStorage.getItem('bnz_org_accent');
          if (org) {
            var a = JSON.parse(org);
            var r = document.documentElement.style;
            if (a.accent) r.setProperty('--accent', a.accent);
            if (a.accentDark) r.setProperty('--accent-dark', a.accentDark);
          }
        } catch (e) { /* storage unavailable — fall back to the CSS defaults */ }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
