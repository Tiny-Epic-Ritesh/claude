# ─────────────────────────────────────────────────────────────────────────────
# Bonanza AI CRM — BT Panel (宝塔面板) Nginx location blocks
#
# HOW TO USE:
#   1. BT Panel → Website → labs.tinyepic.in → Config
#   2. Find the existing  server { ... }  block for labs.tinyepic.in
#   3. Paste everything BELOW this comment box inside that server{} block
#   4. Click Save → the panel will reload Nginx automatically
#
# SSL is already managed by BT Panel — do NOT add ssl_certificate lines here.
# ─────────────────────────────────────────────────────────────────────────────

# ── API: proxy to the Docker container on localhost:4100 ──────────────────────
# Nginx strips /ai-crm so Express still receives the standard /api/... paths.
location /ai-crm/api/ {
    proxy_pass         http://127.0.0.1:4100/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 5m;
}

# DKYC public surface (no auth required)
location /ai-crm/dkyc {
    proxy_pass         http://127.0.0.1:4100/dkyc;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Public market data / unauthenticated endpoints
location /ai-crm/public/ {
    proxy_pass         http://127.0.0.1:4100/public/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── React SPA: proxy all other /ai-crm/* requests to Express ─────────────────
# Express serves the built client/dist/ files for any path it doesn't recognise
# as an API route, acting as a static file server + SPA fallback in one.
location /ai-crm/ {
    proxy_pass         http://127.0.0.1:4100/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Redirect bare /ai-crm (no trailing slash) → /ai-crm/
location = /ai-crm {
    return 301 /ai-crm/;
}

# Redirect bare site root and any path outside /ai-crm → /ai-crm/
# Must be the last (least-specific) location so the more-specific blocks above
# win when the request really belongs there.
location / {
    return 301 /ai-crm/;
}
