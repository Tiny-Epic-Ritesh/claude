name: Build & Deploy to UAT

on:
  push:
    branches:
      - main          # change to your default branch if different

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo" — Docker requires lowercase
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build Docker image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic — no secret to add

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max    # GitHub Actions cache speeds up rebuilds

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to UAT server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: uat
    permissions:
      contents: read
      packages: read    # needed so GITHUB_TOKEN can pull from GHCR on the server

    steps:
      # Checkout is needed only to get docker-compose.yml.
      # The full source code is NEVER sent to EC2.
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      # Write the SSH key to a temp file.
      # GitHub Secrets can strip trailing newlines from multi-line values,
      # which breaks OpenSSH key parsing. Writing it explicitly fixes this.
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.UAT_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # SCP just the one config file the server actually needs.
      # scp-action runs inside Docker so it can't use key_path (runner filesystem).
      # We pass the key inline instead — the new bonanza_cicd key has no newline issues.
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/www/wwwroot/labs.tinyepic.in"
          overwrite: true
          timeout: 30s

      # SSH in, log into GHCR with the workflow token, pull the new image, swap.
      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: sha-${{ needs.build-and-push.outputs.short_sha }}
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key_path: ~/.ssh/deploy_key
          timeout: 30s
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e

            # Log into GHCR using the workflow's token — no manual PAT needed
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /www/wwwroot/labs.tinyepic.in

            # Pin to the exact SHA built in this run — no "latest" drift
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.deploy

            # Pull the new image from GHCR
            docker compose --env-file .env.deploy pull app

            # Zero-downtime swap: starts new container, stops old one
            docker compose --env-file .env.deploy up -d --remove-orphans

            # Remove dangling images to keep disk tidy
            docker image prune -f

            echo "✅ Deployed $IMAGE_TAG"
